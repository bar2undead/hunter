<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>云端冒险 · Skybound Adventure</title><style>*{box-sizing:border-box}body{margin:0;background:#101b35;color:white;font-family:system-ui,'Microsoft YaHei',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}header{width:min(100%,1000px);padding:15px 12px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:22px;margin:0}small{color:#b5c9ef}button{border:0;border-radius:12px;background:#f6c94d;color:#17213d;font-weight:800;padding:10px 17px;cursor:pointer}#game{width:min(100%,1000px);aspect-ratio:16/9;border:3px solid #415b91;border-radius:14px;display:block;background:#80d7ff;touch-action:none}#info{width:min(100%,1000px);padding:10px 14px;color:#c5d7f8;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.controls{display:flex;gap:18px;justify-content:space-between;width:min(100%,1000px);padding:8px 16px 20px;touch-action:none}.controls button{font-size:22px;min-width:72px;min-height:60px;background:#345589;color:white;user-select:none}.controls #jump{background:#efaa42;color:#17213d;min-width:105px}@media(min-width:800px){.controls{display:none}} .lobby{width:min(100%,1000px);display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:10px 12px;background:#22385e;border-radius:12px;margin-bottom:10px}.lobby input{width:160px;padding:10px;border-radius:8px;border:0;font-size:16px}.lobby span{font-size:14px;color:#dbe8ff}</style></head><body><header><div><h1>☁️ 云端冒险 <small>Skybound Adventure</small></h1><small>双人实时联网合作闯关</small></div><button id="restart">重新开始 ↻</button></header><div class="lobby"><button id="create">创建房间</button><input id="roomCode" maxlength="6" inputmode="numeric" placeholder="输入六位房间号"><button id="join">加入房间</button><span id="roomLabel"></span><span id="status">点击创建房间开始</span></div><canvas id="game" width="960" height="540"></canvas><div id="info"><span>⌨️ ← → / A D 移动 · 空格 / ↑ / W 跳跃 · E 救援队友 · R 重开</span><span>📱 手机可使用下方触控按钮</span></div><div class="controls"><div style="display:flex;gap:12px"><button id="left">◀</button><button id="right">▶</button></div><div style="display:flex;gap:8px"><button id="rescue">救援 ♥</button><button id="jump">跳跃 ⬆</button></div></div><script src="/client.js"></script></body></html>
